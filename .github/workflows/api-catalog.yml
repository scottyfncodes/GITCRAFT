name: API catalogue

# API Discovery's data, refreshed without a redeploy: fetch the public-apis catalogue, check every documentation link
# once, and publish the result (apis.json) to the `api-catalog` branch. The /apis/ page looks there for a newer copy and
# falls back to the catalogue bundled with the deployment; the MCP tools use the committed snapshot (apidiscovery/data).
#
#   refresh   an upstream that cannot be fetched or does not parse keeps the committed catalogue (never an empty one)
#   check     one GET per API; a run where most links are unreachable is the runner's network, and is not published
#   publish   only from main (schedule or manual run); a pull request stops after a dry run and uploads the file
#
# Nothing here touches main, the site build or any GITCRAFT score: a failure leaves the published branch as it was.
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays, 04:17 UTC
  workflow_dispatch:
  pull_request:
    paths: ["apidiscovery/**", ".github/workflows/api-catalog.yml"]

permissions:
  contents: read

concurrency:
  group: api-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write   # the publish step pushes the api-catalog branch (never main)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Refresh the catalogue from public-apis (keeps the committed one if the upstream is unavailable)
        run: python3 -m apidiscovery refresh

      - name: Check documentation links (one request per API; a pull request checks a sample)
        run: python3 -m apidiscovery check ${{ github.event_name == 'pull_request' && '--limit 150' || '' }}

      - name: Build the data file and confirm it is a sound catalogue
        run: |
          mkdir -p out
          python3 -m apidiscovery build out/apis.json
          python3 - <<'PY'
          import json
          D = json.load(open("out/apis.json"))
          assert D["schema"] == 1 and len(D["entries"]) >= 500, f"only {len(D['entries'])} entries"
          assert D["checks"]["checked"], "no link checks in the data file"
          print(f"{len(D['entries'])} APIs, catalogue fetched {D['catalogue']['fetched']}, links checked {D['checks']['checked']}: {D['checks']['counts']}")
          PY
          python3 -m apidiscovery status

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-catalog
          path: out/apis.json

      - name: Publish to the api-catalog branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cd out
          cat > README.md <<'MD'
          # GITCRAFT API Discovery: published catalogue

          `apis.json` is generated by `.github/workflows/api-catalog.yml` on `main` and read by the API Discovery page.
          Do not edit it by hand: the next run replaces this branch.

          The list of APIs, their descriptions and the Auth / HTTPS / CORS columns come from
          [public-apis](https://github.com/public-apis/public-apis) (MIT, Copyright (c) 2022 public-apis).
          The link checks are GITCRAFT's own: one request per documentation link on the date in the file.
          MD
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b api-catalog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apis.json README.md vercel.json
          git commit -q -m "API catalogue ${GITHUB_SHA::7} $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" api-catalog
