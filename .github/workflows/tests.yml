name: Tests

# Every pull request (and main): install GITCRAFT the way a user's machine does, then run the guard/sandbox
# policy test, the Studio departments (quick: no Blender actions) and the 3D Department. The tools run behind
# scripts/mcp.sh exactly as in a session (guard + Landlock), so a launcher or sandbox regression fails here.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers   # under /opt: the sandbox lets tools execute from there
      GITCRAFT_GLOBAL_INSTRUCTIONS: "0"            # CI has no ~/.claude to manage
      GITCRAFT_GLOBAL_HOOK: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/gitcraft-ci-setup

      - name: Install GITCRAFT (2D tools, Studio core, MeshCraft + ForgeCraft)
        env:
          GITCRAFT_STUDIO_VOICE: "0"               # the voice model is exercised by tests/test_studio.py locally
        run: scripts/install.sh

      - name: Doctor
        run: scripts/doctor.sh || true

      - name: Policy (guard + sandbox)
        run: python3 tests/test_policy.py

      - name: Server stdio isolation (the MCP protocol pipes are private to each server, #45)
        run: python3 tests/test_stdio_isolation.py

      - name: Long tool calls answer before the client's timeout (call_id + call_result)
        run: python3 tests/test_long_calls.py

      - name: Studio departments (quick)
        run: python3 tests/test_studio.py --quick

      - name: ForgeCraft (3D Department)
        run: python3 tests/test_forgecraft.py

      - name: MeshCraft engine check packages + queued installs
        run: python3 tests/test_engine_check_deps.py

      - name: Production Director (unit + a real production through the sandboxed server)
        run: python3 tests/test_production.py

      - name: Lifecycle, App Icon Studio, HaveAnApp attribution, engineering standards
        run: python3 tests/test_lifecycle.py

      - name: Run GITCRAFT (universal entry, maturity-aware workflows, preservation)
        run: python3 tests/test_entry.py

      - name: Understanding the assignment, creative direction first, before/after comparisons, tools
        run: python3 tests/test_understanding.py

      - name: Starters, feature checks, backend, native icons, Pulse, verify-live
        run: python3 tests/test_gaps.py

      - name: Hardening (guard + control room regressions from docs/tech-debt.md)
        run: python3 tests/test_hardening.py

      - name: Department linkage (project kind, hand-offs, gates, findings into work orders, registration race)
        run: python3 tests/test_linkage.py

      - name: Run GITCRAFT report (read-only cross-department project report)
        run: python3 tests/test_report.py

      - name: Report coverage (measured refreshes are scored, TestCraft/AssetCraft refreshed read-only, workspace roots, failure reasons)
        run: python3 tests/test_report_coverage.py

      - name: Report trust (runs with no env var, stale/environment-limited evidence, deduplication, finding contract, scoring, quick smoke, 3D servers)
        run: python3 tests/test_report_trust.py
      - name: Orchestration (plan v2 graph, transactional integration, ownership, consolidated approval, v1 compatibility)
        run: python3 tests/test_orchestration.py
      - name: Layered QA (department, integration and product QA; routing, retries, optional, unavailable, verdicts)
        run: python3 tests/test_layered_qa.py
      - name: Creative Review (advisory, never scored; technical output identical with and without it)
        run: python3 tests/test_creative.py

      - name: Release verification (POW NOW PR #40 - blocker / unverified / advisory / pass stay distinct)
        run: python3 tests/test_release_verification.py

      - name: Evaluation orchestration (no self-triggering loops, one target, isolated store, a final verdict)
        run: python3 tests/test_evaluation.py

      - name: Evaluation follow-ups (task output isolated for every production, replacement checks keep their criterion)
        run: python3 tests/test_evaluation_followups.py

      - name: Resuming a stopped production (FOXTAIL - blocked on an unbuilt app, the task folder, replaced hand-offs, a run that dies)
        run: python3 tests/test_resume.py

      - name: Source-change fingerprints (a check's output never invalidates another check)
        run: python3 tests/test_fingerprint.py

      - name: Runtime updates never break running servers (versioned runtime, Landlock)
        run: python3 tests/test_runtime_update.py

      - name: PLAYCRAFT is told only what the person stated (assumed genre / platform are detected)
        run: python3 tests/test_playcraft_hints.py

      - name: Production Director master-prompt acceptance (every department for real)
        run: python3 tests/acceptance_production.py

      - name: Logs on failure
        if: failure()
        run: |
          tail -n 80 ~/.gitcraft/logs/*.log || true
