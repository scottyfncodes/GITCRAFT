name: Build ArtCraft CLIs

# Builds the seven ArtCraft CLIs (each one includes its MCP server) from the upstream commits pinned in
# scripts/tools.sh, and proves they work. It never publishes: it produces a release candidate.
#
#   build    all seven, on ubuntu-24.04, from the pinned upstream commit (verified), each binary refused above the
#            glibc ceiling
#   gate     scripts/release-gate.sh on exactly those binaries: all seven present, glibc ceiling re-checked, and a
#            fresh install of THESE binaries (tests/test_global.sh, published builds made unreachable) with every check
#            passing and the installed binaries byte-identical to the candidates
#   pin      the `bin.sha256` artifact: the candidate's checksums in the format of scripts/bin.sha256, naming this run
#
# Publishing is a separate, reviewed step (.github/workflows/publish-bin.yml): a pull request copies `bin.sha256` into
# scripts/bin.sha256; merging it publishes exactly those files from this run, and install.sh installs only binaries
# whose checksums are pinned there. Nothing here can change the `bin` branch.
on:
  push:
    branches: [main]
    paths: [".github/workflows/build.yml", "scripts/tools.sh", "scripts/release-gate.sh"]
  pull_request:   # validates the build and the gate; never publishes
    paths: [".github/workflows/build.yml", ".github/actions/gitcraft-ci-setup/**", "scripts/release-gate.sh", "scripts/tools.sh",
            "scripts/install.sh", "scripts/setup-env.sh", "scripts/bin.sha256", "tests/test_global.sh", "tests/global_project_check.py"]
  workflow_dispatch:
    inputs:
      gate_selftest:
        description: "Inject a controlled fault into the gate's staging copy to prove publication is blocked (never publishes)"
        type: choice
        options: [none, glibc, broken-binary]
        default: none
      claude_session:
        description: "Also run the gate's three headless Claude Code checks (uses the ANTHROPIC_API_KEY secret: billed per token)"
        type: boolean
        default: false
  schedule:
    - cron: "17 9 * * 1" # Mondays, picks up upstream changes

permissions:
  contents: read

concurrency:
  group: build-clis-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # never cancel a main run that may be publishing

env:
  GLIBC_CEILING: "2.39"   # Ubuntu 24.04: the Tests runner and Claude Code cloud sessions

jobs:
  build:
    name: ${{ matrix.tool.name }}
    # Pinned, not ubuntu-latest: a binary needs the glibc it was linked against, and the Tests runner
    # and Claude Code cloud sessions have glibc 2.39 (Ubuntu 24.04). ubuntu-latest moved to glibc 2.43.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tool:
          - { name: photocraft,  repo: photocraft,  pkg: photocraft-cli }
          - { name: vectorcraft, repo: vectorcraft, pkg: vectorcraft-cli }
          - { name: filmcraft,   repo: filmcraft,   pkg: filmcraft-cli }
          - { name: lightcraft,  repo: lightcraft,  pkg: lightcraft-cli }
          - { name: pdfcraft,    repo: printcraft,  pkg: pdfcraft-cli }
          - { name: effectcraft, repo: effectcraft, pkg: effectcraft-cli }
          - { name: designcraft, repo: designcraft, pkg: designcraft-cli }
    steps:
      - name: Check out this repository's scripts/tools.sh (the pins)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: self
          sparse-checkout: scripts/tools.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: The pinned upstream commit (scripts/tools.sh)
        id: pin
        run: |
          sha=$(bash -c 'source self/scripts/tools.sh >/dev/null 2>&1; gitcraft_upstream_sha "$1"' _ "${{ matrix.tool.name }}")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no pinned upstream commit for ${{ matrix.tool.name }} in scripts/tools.sh"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "storytold/${{ matrix.tool.repo }} @ $sha"

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev libudev-dev libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libfontconfig1-dev libfreetype-dev

      - name: Check out storytold/${{ matrix.tool.repo }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/${{ matrix.tool.repo }}
          ref: ${{ steps.pin.outputs.sha }}
          path: src
          lfs: false
          persist-credentials: false

      - name: Verify the checkout is the pinned commit
        run: '[ "$(git -C src rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}" ] || { echo "::error::storytold/${{ matrix.tool.repo }} is not at the pinned commit"; exit 1; }'

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11 (toolchain version pinned below)
        with:
          toolchain: "1.100.0"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
          key: ${{ matrix.tool.pkg }}

      - name: Build
        working-directory: src
        run: cargo build --release --locked -p ${{ matrix.tool.pkg }}

      - name: Check glibc compatibility (must run on glibc ${{ env.GLIBC_CEILING }})
        run: |
          bin=src/target/release/${{ matrix.tool.pkg }}
          need=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "${{ matrix.tool.pkg }} requires glibc $need (limit $GLIBC_CEILING)"
          [ "$(printf '%s\n' "$need" "$GLIBC_CEILING" | sort -V | tail -1)" = "$GLIBC_CEILING" ] \
            || { echo "::error::${{ matrix.tool.pkg }} needs glibc $need, newer than $GLIBC_CEILING: not publishing it"; exit 1; }

      - name: Package
        run: |
          mkdir out
          strip src/target/release/${{ matrix.tool.pkg }}
          gzip -9 -c src/target/release/${{ matrix.tool.pkg }} > out/${{ matrix.tool.pkg }}.gz
          echo "${{ matrix.tool.name }} ${{ matrix.tool.pkg }} $(git -C src rev-parse --short HEAD) $(date -u +%F)" > out/${{ matrix.tool.name }}.manifest
          ls -lh out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.tool.name }}
          path: out/
          retention-days: 7

  gate:
    name: release gate (fresh install of these binaries)
    needs: build   # every build job must succeed: no partial release, no carry-over of an older binary
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
      GITCRAFT_GATE_SELFTEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.gate_selftest != 'none') && inputs.gate_selftest || '' }}
      # paid API use is opt-in per run (docs/costs.md); otherwise the key is empty and the headless checks are skipped
      ANTHROPIC_API_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.claude_session) && secrets.ANTHROPIC_API_KEY || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/gitcraft-ci-setup

      - name: Claude Code CLI (for the 'claude mcp list' checks; no sign-in needed)
        run: npm i -g @anthropic-ai/claude-code@2.1.327 && claude --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect the candidates
        run: |
          mkdir -p candidate
          for t in photocraft vectorcraft filmcraft lightcraft pdfcraft effectcraft designcraft; do
            [ -d "artifacts/$t" ] || { echo "::error::no build of $t in this run"; exit 1; }
            cp "artifacts/$t"/* candidate/
          done
          ls -l candidate

      - name: Release gate
        shell: bash
        run: |
          git checkout -B "release-gate-${GITHUB_RUN_ID}"   # the fresh install clones a named branch of this checkout
          GITCRAFT_GLIBC_CEILING="$GLIBC_CEILING" scripts/release-gate.sh "$PWD/candidate" "$RUNNER_TEMP/gate"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate   # exactly what publish may push, with the gate's SHA256SUMS
          path: candidate/
          retention-days: 7

      - name: Gate logs
        if: always()
        run: |
          grep -E '^(PASS|FAIL|SKIP)|checks passed' "$RUNNER_TEMP/gate/test_global.out" 2>/dev/null || true
          tail -n 60 "$RUNNER_TEMP"/gate/global/home-*/.gitcraft/logs/install.log 2>/dev/null || true

      - name: The release pin (bin.sha256), for a pull request that publishes this candidate
        run: |
          {
            echo "# Trusted prebuilt ArtCraft CLIs: the SHA-256 of every <pkg>.gz that install.sh may install from the \`bin\` branch."
            echo "# install.sh refuses a prebuilt whose checksum is not listed here (checked before it is decompressed or run), and"
            echo "# .github/workflows/publish-bin.yml publishes to \`bin\` only the release candidate whose files match this list exactly."
            echo "#"
            echo "# Change it only by pull request: copy the \`bin.sha256\` artifact of a green \"Build ArtCraft CLIs\" run on main"
            echo "# (it names the run below), review it, merge. Merging publishes those exact binaries (docs/install.md, \"Releases\")."
            echo "# run: ${GITHUB_RUN_ID}"
            (cd candidate && sha256sum *.gz | sort -k2)
          } > bin.sha256
          { echo "### Release candidate (not published)"; echo; echo "Built from: ${GITHUB_REF} @ ${GITHUB_SHA::7}, run ${GITHUB_RUN_ID}."
            echo "To publish it: on a branch, replace scripts/bin.sha256 with the \`bin.sha256\` artifact of this run (main runs only), open a pull request, review, merge."
            echo; echo '```'; cat bin.sha256; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin.sha256
          path: bin.sha256
          retention-days: 7
