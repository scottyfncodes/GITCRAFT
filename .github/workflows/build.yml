name: Build ArtCraft CLIs

# Builds the seven ArtCraft CLIs (each one includes its MCP server) and
# publishes them to the `bin` branch, so Claude Code sessions can grab them
# with a quick git fetch instead of compiling for an hour.
on:
  push:
    branches: [main]
    paths: [".github/workflows/build.yml", "scripts/tools.sh"]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1" # Mondays, picks up upstream changes

permissions:
  contents: write

concurrency:
  group: build-clis
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.tool.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - { name: photocraft,  repo: photocraft,  pkg: photocraft-cli }
          - { name: vectorcraft, repo: vectorcraft, pkg: vectorcraft-cli }
          - { name: filmcraft,   repo: filmcraft,   pkg: filmcraft-cli }
          - { name: lightcraft,  repo: lightcraft,  pkg: lightcraft-cli }
          - { name: pdfcraft,    repo: printcraft,  pkg: pdfcraft-cli }
          - { name: effectcraft, repo: effectcraft, pkg: effectcraft-cli }
          - { name: designcraft, repo: designcraft, pkg: designcraft-cli }
    steps:
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev libudev-dev libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libfontconfig1-dev libfreetype-dev

      - name: Check out storytold/${{ matrix.tool.repo }}
        uses: actions/checkout@v4
        with:
          repository: storytold/${{ matrix.tool.repo }}
          path: src
          lfs: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: ${{ matrix.tool.pkg }}

      - name: Build
        working-directory: src
        run: cargo build --release --locked -p ${{ matrix.tool.pkg }}

      - name: Package
        run: |
          mkdir out
          strip src/target/release/${{ matrix.tool.pkg }}
          gzip -9 -c src/target/release/${{ matrix.tool.pkg }} > out/${{ matrix.tool.pkg }}.gz
          echo "${{ matrix.tool.name }} ${{ matrix.tool.pkg }} $(git -C src rev-parse --short HEAD) $(date -u +%F)" > out/${{ matrix.tool.name }}.manifest
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool.name }}
          path: out/
          retention-days: 7

  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Keep last good builds for anything that failed
        run: |
          mkdir -p bin
          git clone --depth 1 --branch bin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" prev 2>/dev/null \
            && cp prev/*.gz prev/*.manifest bin/ 2>/dev/null || true
          cp artifacts/*/* bin/ 2>/dev/null || true
          ls bin/*.gz >/dev/null 2>&1 || { echo "nothing built"; exit 1; }

      - name: Push to bin branch
        working-directory: bin
        run: |
          cat *.manifest | sort > MANIFEST.txt
          cat > README.md <<'EOF'
          Prebuilt Linux x86_64 ArtCraft CLIs, generated by .github/workflows/build.yml.
          Don't edit by hand. MANIFEST.txt lists the upstream commit each one was built from.
          EOF
          sed -i 's/^ *//' README.md
          git init -q -b bin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Prebuilt CLIs $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" bin
          cat MANIFEST.txt >> "$GITHUB_STEP_SUMMARY"
