name: Nightly product suites

# The heavier product-level suites that tests.yml (every pull request) does not run, nightly on main, in parallel
# groups. Nothing here duplicates tests.yml; the fresh-install group checks the *published* `bin` release that users
# install today (build.yml's gate checks each new candidate before it is published).
#
# Deliberately not here: tests/test_ui.py (known environment-dependent failures, docs/tech-debt.md) and
# tests/test_fresh_install.sh (the 3D-only fresh install, covered by tests/test_global.sh) and
# tests/test_mcp_deferred_session.py (drives real `claude -p` sessions: billed, so never on a schedule per docs/costs.md;
# later-setup.yml covers the same deferred-Blender path with MCP clients for free).
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  pull_request:   # a change to this workflow runs it once
    paths: [".github/workflows/nightly.yml"]

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: ${{ matrix.group.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group:
          - { name: pixelcraft,   install: true,  suites: "tests/test_pixelcraft.py" }
          - { name: playcraft,    install: true,  suites: "tests/test_playcraft.py tests/test_playcraft_history.py" }
          - { name: designcraft,  install: true,  suites: "tests/test_designcraft.py" }
          - { name: 3d,           install: true,  suites: "tests/test_meshcraft.py tests/test_meshcraft_structural.py tests/test_audit_and_copper.py tests/test_forgecraft_engine.py tests/test_forgecraft_web.py" }
          - { name: netgate,      install: true,  suites: "tests/test_netgate.py" }
          - { name: fresh-install (published bin), install: false, suites: "tests/test_global.sh" }
    env:
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
      GITCRAFT_STUDIO_VOICE: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/gitcraft-ci-setup

      - name: Install GITCRAFT
        if: matrix.group.install
        env:   # only here: the fresh-install test must see the user-level instructions and skills being installed
          GITCRAFT_GLOBAL_INSTRUCTIONS: "0"
          GITCRAFT_GLOBAL_HOOK: "0"
        run: scripts/install.sh

      - name: Claude Code CLI (for the fresh-install 'claude mcp list' checks; no sign-in needed)
        if: ${{ !matrix.group.install }}
        run: npm i -g @anthropic-ai/claude-code && claude --version

      - name: Suites
        shell: bash
        run: |
          git checkout -B "nightly-${GITHUB_RUN_ID}"   # test_global.sh clones a named branch of this checkout
          failed=()
          for t in ${{ matrix.group.suites }}; do
            echo "::group::$t"
            case "$t" in *.sh) bash "$t" ;; *) python3 "$t" ;; esac; rc=$?
            echo "::endgroup::"
            echo "| $t | $([ $rc -eq 0 ] && echo pass || echo "FAIL ($rc)") |" >> "$GITHUB_STEP_SUMMARY"
            [ $rc -eq 0 ] || failed+=("$t")
          done
          [ ${#failed[@]} -eq 0 ] || { echo "::error::failed: ${failed[*]}"; exit 1; }

      - name: Logs on failure
        if: failure()
        run: tail -n 80 ~/.gitcraft/logs/*.log || true
