<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>API Discovery · GITCRAFT</title>
<meta name="description" content="Describe what you need, find APIs that could do it, compare what is actually known about them, and get integration guidance. Built on the public-apis catalogue.">
<meta name="theme-color" content="#071a33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='14' r='9' fill='none' stroke='%231FB5B0' stroke-width='4'/%3E%3Cpath d='M21 21l8 8' stroke='%23F4C542' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <a class="mark" href="./" aria-label="API Discovery home"><span class="lens" aria-hidden="true"></span><span><b>GITCRAFT</b><small>API Discovery</small></span></a>
  <nav aria-label="GITCRAFT"><a href="../">3D Department</a><a href="../reports/">Reports</a></nav>
</header>
<main id="app">
  <section class="ask" aria-labelledby="askTitle">
    <h1 id="askTitle">What do you need an API for?</h1>
    <p class="lede">Describe the feature. You get candidates from the public-apis catalogue, what is actually known about each, and how to integrate the one you pick.</p>
    <form id="askForm" role="search" autocomplete="off">
      <label class="sr" for="q">Describe what you need</label>
      <div class="field">
        <input id="q" name="q" type="search" enterkeyhint="search" placeholder="e.g. weather for a hiking app" maxlength="200">
        <button class="btn primary" type="submit">Find APIs</button>
      </div>
    </form>
    <div class="examples" id="examples" aria-label="Example needs"></div>
    <div class="context">
      <fieldset id="platform"><legend>Building for</legend>
        <div class="seg">
          <label><input type="radio" name="platform" value="server" checked><span>Server</span></label>
          <label><input type="radio" name="platform" value="browser"><span>Browser</span></label>
          <label><input type="radio" name="platform" value="mobile"><span>Mobile app</span></label>
        </div>
      </fieldset>
      <div class="pick"><label for="lang">Examples in</label><select id="lang"></select></div>
    </div>
    <details class="filters" id="filters">
      <summary><span>Filters</span><span class="count" id="filterCount"></span></summary>
      <div class="fgrid">
        <div class="pick"><label for="fCategory">Category</label><select id="fCategory"><option value="">Any category</option></select></div>
        <div class="pick"><label for="fAuth">Authentication</label><select id="fAuth"><option value="">Any</option><option value="none">No key</option><option value="apiKey">API key</option><option value="oauth">OAuth</option></select></div>
        <label class="check"><input type="checkbox" id="fHttps"><span>HTTPS listed</span></label>
        <label class="check"><input type="checkbox" id="fCors"><span>CORS listed</span></label>
        <label class="check"><input type="checkbox" id="fDocs"><span>Documentation link answered our check</span></label>
      </div>
    </details>
  </section>
  <section id="out" aria-live="polite" aria-busy="true"><p class="state">Loading the catalogue…</p></section>
</main>
<div class="tray" id="tray" hidden><span id="trayText"></span><div class="row"><button class="btn" id="trayClear" type="button">Clear</button><button class="btn primary" id="trayGo" type="button">Compare</button></div></div>
<dialog id="dlg" aria-labelledby="dlgTitle"><div class="dhead"><h2 id="dlgTitle"></h2><button class="btn" id="dlgClose" type="button" aria-label="Close">Close</button></div><div id="dlgBody"></div></dialog>
<footer class="foot" id="foot"></footer>
<script src="app.js"></script>
</body>
</html>
