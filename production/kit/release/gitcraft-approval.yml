# GITCRAFT approval gate: a person approves a deployment or an infrastructure change in GitHub, where the agent that
# would carry it out cannot approve it. Copy this file to .github/workflows/gitcraft-approval.yml in the app's
# repository (on its default branch), then, once, in the repository's Settings > Environments:
#   production      Required reviewers: you. Untick "Allow administrators to bypass configured protection rules".
#   infrastructure  the same.
# The agent starts a run (production / task / environment as GITCRAFT asks); GitHub waits for your approval (web or the
# GitHub mobile app); GITCRAFT then verifies the approved run through GitHub's API (python3 -m production approve-external).
# The job holds no secrets and needs no permissions: the approval itself is the result.
name: GITCRAFT approval
run-name: "GITCRAFT approval: ${{ inputs.production }} ${{ inputs.task }}"

on:
  workflow_dispatch:
    inputs:
      production:
        description: "GITCRAFT production id"
        required: true
      task:
        description: "the task to approve (release.deploy, backend.provision)"
        required: true
      environment:
        description: "production (deployments) or infrastructure (databases, hosting)"
        type: choice
        options: [production, infrastructure]
        required: true
      summary:
        description: "what exactly is being approved (shown to the reviewer)"
        required: false

permissions: {}

jobs:
  approve:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Approved
        env:
          PRODUCTION: ${{ inputs.production }}
          TASK: ${{ inputs.task }}
          ENVIRONMENT: ${{ inputs.environment }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          printf 'Approved by a required reviewer of the %s environment: %s %s\n%s\n' "$ENVIRONMENT" "$PRODUCTION" "$TASK" "$SUMMARY" | tee -a "$GITHUB_STEP_SUMMARY"
