<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{TITLE}} by HaveAnApp">
  <meta name="author" content="HaveAnApp">
  <!-- App Icon Studio: icon.derivatives replaces this block with its icons.snippet.json head -->
  <link rel="icon" href="assets/icons/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="game" aria-label="{{TITLE}}"></canvas>
  <div class="hud"><button id="pause" type="button">Pause</button><button id="mute" type="button">Sound on</button></div>
  <div class="title" id="title"><h1>{{TITLE}}</h1><p>Tap or press Space to start</p>
    <p class="haveanapp-byline" data-haveanapp>{{TITLE}} <a class="haveanapp-byline__by" href="https://haveanapp.com" rel="noopener" target="_blank">by HaveAnApp</a></p></div>
  <p class="error" id="error" role="alert" hidden></p>
  <script src="game.js"></script>
</body>
</html>
